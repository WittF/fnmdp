# Static SPA server for the built web app (container port 8897, see deploy/k8s/web.yaml).
server {
    listen 8897;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or clients pin a stale asset manifest.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Long-cache fingerprinted assets (filenames carry a content hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + live WebSocket reverse proxy to the master.
    #
    # In production the Envoy HTTPRoute may route /api and /live straight to the
    # master Service, bypassing nginx (see deploy/k8s/httproute.yaml). These blocks
    # are kept commented so this image can also front the master directly when a
    # MASTER_HOST is provided; uncomment + set the upstream during deploy. In dev,
    # `vite dev` proxies these paths instead (see web/vite.config.ts).
    #
    # location /api/ {
    #     proxy_pass http://master:8080;
    # }
    # location /live {
    #     proxy_pass http://master:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 1h;
    # }
}
