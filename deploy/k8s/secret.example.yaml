# TEMPLATE ONLY — do NOT fill in and commit (public repo). The real Secret is
# created out-of-band so values never enter git:
#
#   kubectl -n fnmdp create secret generic fnmdp-secrets \
#     --from-literal=pg-password='<postgres password>' \
#     --from-literal=valkey-password='<valkey password>' \
#     --from-literal=node-token="$(openssl rand -hex 32)" \
#     --from-literal=admin-token="$(openssl rand -hex 32)"
#
# NODE_TOKEN must match what the collector nodes are started with (deploy/nodes/).
# ADMIN_TOKEN authorizes POST/PUT/DELETE /api/admin/projects.
