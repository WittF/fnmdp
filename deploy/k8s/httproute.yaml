# Example edge routing via a Gateway API implementation (tested with Envoy Gateway).
# Replace the hostname and parentRef with your own domain and Gateway.
# Path split: API + WebSockets to the master, everything else to the static web.
# Gateway API picks the most-specific matching path, so /api,/live,/ingest win
# over the catch-all /. /live and /ingest are WebSocket upgrades — Envoy passes
# HTTP/1.1 Upgrade through by default, no extra config needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fnmdp-envoy-route
  namespace: fnmdp
spec:
  hostnames:
    - fnmdp.example.com
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: example-gateway
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /live
        - path:
            type: PathPrefix
            value: /ingest
      backendRefs:
        - group: ""
          kind: Service
          name: fnmdp-master
          port: 80
      timeouts:
        request: "0s"          # WebSockets are long-lived; disable request timeout
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: fnmdp-web
          port: 80
