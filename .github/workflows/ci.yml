name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # Repo root has go.work but no root go.mod, so use explicit package patterns.
      - name: build
        run: go build ./shared/... ./master/... ./node/...
      - name: vet
        run: go vet ./shared/... ./master/... ./node/...
      - name: test
        run: go test ./shared/... ./master/... ./node/...

  web:
    runs-on: ubuntu-latest
    env:
      # Pro postinstall authenticates + downloads @heroui-pro artifacts from
      # the CDN; without it the package installs as an empty stub and tsc fails
      # with TS2307. CI/CD token from heroui.pro/dashboard. Without the secret
      # (forks, or upstream before it's configured) the web job is skipped.
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      - name: HeroUI Pro token missing — skipping web build
        if: env.HEROUI_AUTH_TOKEN == ''
        run: echo "::notice::HEROUI_AUTH_TOKEN not set; web build/test skipped (see README)."
      - uses: actions/checkout@v4
        if: env.HEROUI_AUTH_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.HEROUI_AUTH_TOKEN != ''
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        if: env.HEROUI_AUTH_TOKEN != ''
        with:
          node-version: "24"
          cache: pnpm
      - if: env.HEROUI_AUTH_TOKEN != ''
        run: pnpm install --frozen-lockfile
      - name: build
        if: env.HEROUI_AUTH_TOKEN != ''
        run: pnpm --dir web build
      - name: test (protocol consistency)
        if: env.HEROUI_AUTH_TOKEN != ''
        run: pnpm --dir web test

  docker:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Images are published only from the upstream repo, and only when the
      # PUBLISH_IMAGES repo variable is "true"; otherwise this job just builds.
      PUBLISH: ${{ github.event_name == 'push' && github.repository == 'WittF/fnmdp' && vars.PUBLISH_IMAGES == 'true' }}
      HAS_HEROUI: ${{ secrets.HEROUI_AUTH_TOKEN != '' }}
    strategy:
      matrix:
        service: [node, master, web]
    steps:
      - name: HeroUI Pro token missing — skipping web image
        if: matrix.service == 'web' && env.HAS_HEROUI != 'true'
        run: echo "::notice::HEROUI_AUTH_TOKEN not set; web image skipped."
      - uses: actions/checkout@v4
        if: matrix.service != 'web' || env.HAS_HEROUI == 'true'
      - uses: docker/setup-buildx-action@v3
        if: matrix.service != 'web' || env.HAS_HEROUI == 'true'
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push when publishing)
        if: matrix.service != 'web' || env.HAS_HEROUI == 'true'
        uses: docker/build-push-action@v6
        with:
          # Repo root context so go.work / shared / web are all visible.
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          # Passed to the web Dockerfile via BuildKit secret mount (unused by the
          # node/master builds). Keeps the Pro CI/CD token out of image layers.
          secrets: |
            heroui_token=${{ secrets.HEROUI_AUTH_TOKEN }}
          # Immutable per-commit tag + moving :latest. Node watchtower tracks
          # :latest; the master/web rollout below pins the exact :<sha>.
          tags: |
            ghcr.io/wittf/fnmdp-${{ matrix.service }}:latest
            ghcr.io/wittf/fnmdp-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Roll master/web to the freshly-pushed :<sha> using a least-privilege
  # service account (deployments get/list/watch/patch only). Nodes update
  # themselves via watchtower (see deploy/nodes/), so they are not rolled here.
  # Upstream only, opt-in: set the DEPLOY_ENABLED repo variable to "true" and
  # the KUBE_CONFIG (base64 kubeconfig) + K8S_NAMESPACE repo secrets.
  deploy:
    if: github.event_name == 'push' && github.repository == 'WittF/fnmdp' && vars.PUBLISH_IMAGES == 'true' && vars.DEPLOY_ENABLED == 'true'
    needs: [docker]
    runs-on: ubuntu-latest
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
    steps:
      - name: Configure kubeconfig
        run: |
          : "${KUBE_CONFIG:?KUBE_CONFIG secret is not set}"
          : "${K8S_NAMESPACE:?K8S_NAMESPACE secret is not set}"
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 -d > "$HOME/.kube/config"
      - name: Roll out master + web
        run: |
          # Skip gracefully until the deployments are bootstrapped (manual
          # first `kubectl apply -f deploy/k8s/`, since the deploy SA can patch
          # but not create). Subsequent pushes roll to the pinned :<sha>.
          if ! kubectl -n "$K8S_NAMESPACE" get deploy/fnmdp-master >/dev/null 2>&1; then
            echo "deployments not bootstrapped yet — skipping rollout"
            exit 0
          fi
          kubectl -n "$K8S_NAMESPACE" set image deploy/fnmdp-master \
            master=ghcr.io/wittf/fnmdp-master:${{ github.sha }}
          kubectl -n "$K8S_NAMESPACE" set image deploy/fnmdp-web \
            web=ghcr.io/wittf/fnmdp-web:${{ github.sha }}
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/fnmdp-master --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deploy/fnmdp-web --timeout=180s
